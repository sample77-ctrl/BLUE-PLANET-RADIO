<!doctype html>
<!-- The four NASA Earth Information Center frames the app bundles, crossfading with a slow push-in. Time from body.go / window.__t.
       node render-frames.mjs pics 12 --q dur=12   (images in graphics/eic/ are copies of public/eic/, credit: NASA Earth Information Center, earth.gov) -->
<html><head><meta charset="utf-8"><title>pics</title>
<style>
@font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url('fonts/ibm-plex-mono-latin-400.woff2') format('woff2'); }
@font-face { font-family: 'Mona Sans'; font-weight: 200 900; font-stretch: 75% 125%; src: url('fonts/mona-sans-vf.woff2') format('woff2'); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; font-family: 'Mona Sans', Arial, sans-serif }
.p { position: absolute; left: 140px; top: 90px; width: 1640px; height: 780px; display: flex; align-items: center; justify-content: center; opacity: 0; overflow: hidden; background: #000; border: 1px solid #2e2e2e }
.p img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: 50% 50% }
.cap { position: absolute; left: 140px; top: 890px; font: 400 24px/1.4 'IBM Plex Mono', monospace; color: #93928d; letter-spacing: .04em }
.cap b { color: #baed3f; font-weight: 400; margin-right: 18px }
.st { position: absolute; inset: 0; opacity: 1 }
</style></head><body>
<div class="st">
  <div class="p" id="p0"><img src="eic/ocean-heat-content.webp"></div>
  <div class="p" id="p1"><img src="eic/greenhouse-gas-index.webp"></div>
  <div class="p" id="p2"><img src="eic/geos-earth-now-rain.webp"></div>
  <div class="p" id="p3"><img src="eic/el-nino-crop-yields.webp"></div>
  <div class="cap"><b id="n">01 / 04</b><span id="t"></span></div>
</div>
<script>
const q = new URLSearchParams(location.search), D = Number(q.get('dur')) || 12, N = 4, per = D / N, X = 0.45
const T = ['Ocean heat content since 1957', 'Greenhouse gas warming index, 1979 to 2021', 'Global weather: rain and cloud (GEOS Earth Now)', 'Forecast El Niño impact on crop yields']
const el = [...document.querySelectorAll('.p')], t0 = performance.now(), ease = (k) => k * k * (3 - 2 * k)
const draw = (now) => { const t = window.__t != null ? window.__t : document.body.classList.contains('go') ? (now - t0) / 1000 : 0
  el.forEach((e, i) => { const a = i * per, b = a + per; let o = 0
    if (t >= a - X && t <= b + X) o = Math.min(ease(Math.min(1, Math.max(0, (t - (a - X)) / X))), i === N - 1 ? 1 : ease(Math.min(1, Math.max(0, (b + X - t) / X))))
    if (i === 0 && t < X) o = Math.min(1, t / 0.4)
    if (i === N - 1 && t > b - 0.1) o = Math.min(1, ease(Math.max(0, (D - t) / 0.5)))
    e.style.opacity = o; const k = Math.min(1, Math.max(0, (t - a + X) / (per + 2 * X))); e.firstElementChild.style.transform = `scale(${1 + 0.06 * k})` })
  const i = Math.min(N - 1, Math.floor(t / per)); document.getElementById('n').textContent = '0' + (i + 1) + ' / 04'; document.getElementById('t').textContent = T[i] + '  ·  NASA Earth Information Center (earth.gov)'
  requestAnimationFrame(draw) }
requestAnimationFrame(draw)
</script></body></html>
